<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #111; color: #fff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 60px; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        p { margin: 0; color: rgba(255,255,255,0.7); font-size: 16px; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #4facfe;
            border-radius: 50%; width: 24px; height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto 0;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Обработка токена...</h1>
        <p id="message">Пожалуйста, подождите.</p>
        <div class="spinner" id="spinner"></div>
    </div>

    <script>
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const spinner = document.getElementById('spinner');

        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');
        const authError = params.get('error') || new URLSearchParams(window.location.search).get('error');

        if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname);
        }

        function showResult(ok, heading, text) {
            title.innerText = heading;
            title.className = ok ? 'success' : 'error';
            message.innerText = text;
            spinner.style.display = 'none';
        }

        const errorTexts = {
            state_mismatch: 'Ответ не совпадает с запросом входа. Нажмите «Запросить токен» в программе ещё раз.',
            not_pending: 'Вход не был начат или время ожидания истекло. Нажмите «Запросить токен» в программе ещё раз.',
            save_failed: 'Программа не смогла сохранить токен. Подробности в окне программы.'
        };

        if (token) {
            fetch('/auth/da/callback', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    access_token: token,
                    expires_in: params.get('expires_in'),
                    state: params.get('state')
                })
            })
                .then(res => res.json().catch(() => ({ok: false})))
                .then(data => {
                    if (data.ok) {
                        showResult(true, 'Авторизация успешна!', 'Можете закрыть эту вкладку и вернуться в программу.');
                    } else {
                        showResult(false, 'Ошибка авторизации', errorTexts[data.error] || 'Попробуйте ещё раз.');
                    }
                })
                .catch(() => showResult(false, 'Ошибка передачи', 'Программа не отвечает. Убедитесь, что она запущена, и попробуйте ещё раз.'));
        } else if (authError) {
            showResult(false, 'Доступ не выдан', 'Вход в DonationAlerts отменён. Нажмите «Запросить токен» в программе, чтобы попробовать снова.');
        } else {
            showResult(false, 'Токен не найден', 'В адресе нет токена доступа. Нажмите «Запросить токен» в программе ещё раз.');
        }
    </script>
</body>
</html>
