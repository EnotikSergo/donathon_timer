<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
          rel="stylesheet">
    <title>Overlay Timer</title>
    <style>
        body, body * {
            padding: 0;
            margin: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        :root {
            --background-color: rgb(45, 45, 44);
            --text-color: #fff;
            --icon-color: #fff;
        }

        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--background-color);
            width: 420px;
            height: 110px;
            border-radius: 32px;
        }

        #textDiv {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        p {
            color: var(--text-color);
            font-size: 5rem;
            font-weight: 600;
            z-index: 1;
            cursor: default;
        }

        .addedTime {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            z-index: 100;
            font-weight: 600;
            font-size: 3.25rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            color: #fff;
            pointer-events: none;
            transition: top 1s ease-out, opacity .5s ease-out;
        }

        span#rubPerHourText {
            color: var(--text-color);
            font-size: 3.7rem;
            font-weight: 600;
            display: none;
            position: absolute;
            bottom: -70px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        span#stopwatchText {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translate(-50%, -20px);
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            z-index: 999;
            transition: opacity 0.5s ease, font-size 0.5s ease, transform 0.5s ease;
        }

        #goalContainer {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            width: 430px;
            height: 72px;
            border-radius: 0 0 24px 24px;
            z-index: -1;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
        }

        #goalText {
            color: #fff;
            font-size: 1.95rem;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        #goalBarBg {
            width: 100%;
            height: 10px;
            background: rgba(45, 45, 44, 0.98);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #goalBarFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            transition: width 0.3s ease-out;
        }

        #pauseIcon {
            position: absolute;
            border-left: 10px solid var(--icon-color);
            border-right: 10px solid var(--icon-color);
            width: 8px;
            height: 30px;
            margin-right: 80%;
            transition: opacity 0.5s ease
        }

        #sleepMoon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scaleX(-1);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 0;
            pointer-events: none;
        }

        #sleepMoon svg {
            width: 95px;
            height: 95px;
            fill: rgba(255, 220, 100, 0.25);
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.05));
        }
    </style>
</head>
<body>
<div id="container">
    <div id="textDiv">
        <div id="sleepMoon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </div>
        <div id="pauseIcon"></div>
        <p id="timeText">00:00:00</p>
        <span id="stopwatchText">прошло 0 д 0 ч 0 м 0 с</span>
    </div>
    <span id="rubPerHourText">1000р = 1 час</span>
    <div id="goalContainer">
        <span id="goalText">Сбор: 0 / 0 руб</span>
        <div id="goalBarBg">
            <div id="goalBarFill"></div>
        </div>
    </div>
</div>
<script>
    const elT = document.getElementById('timeText');
    let currentPauseState = null;
    let currentRubPreHourState = null;
    let currentShowStopWatchState = null;
    let currentStopWatchTextState = null;
    let currentRemainingTimeState = null;
    let currentGoalState = null;
    let currentGoalPrecentageState = null;
    let currentGoalTextState = null;
    let currentSleepState = null;

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min)) + min;
    }

    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    async function showAdded(seconds) {
        const abs = Math.abs(seconds);
        const sign = seconds > 0 ? '+' : '−';

        const addedTime = document.createElement('p');
        addedTime.className = 'addedTime';
        addedTime.innerText = `${sign}${abs.toFixed(3).replace(/\.?0+$/, '')}s`;
        document.body.appendChild(addedTime);
        addedTime.style.display = "block";
        addedTime.style.left = `${rand(35, 65)}%`;
        addedTime.style.top = `${rand(35, 65)}%`;
        addedTime.style.opacity = '0';
        await sleep(50);
        addedTime.style.top = `${rand(35, 65)}%`;
        addedTime.style.opacity = '1';
        await sleep(2500);
        addedTime.style.opacity = '0';
        await sleep(500);
        addedTime.remove();
    }


    function apply(state) {
        if (!state) return;
        if (state.remaining != null && state.remaining !== currentRemainingTimeState) {
            currentRemainingTimeState = state.remaining;
            elT.textContent = state.remaining;
        }
        if (state.color != null) document.documentElement.style.setProperty('--fg', state.color);

        if (state.showRubPerHour !== undefined && state.rublesPerHour !== undefined && state.rublesPerHour !== currentRubPreHourState) {
            currentRubPreHourState = state.rublesPerHour;
            const elRub = document.getElementById('rubPerHourText');
            if (elRub) {
                elRub.textContent = `${state.rublesPerHour}р = 1 час`;
                elRub.style.display = state.showRubPerHour ? 'block' : 'none';
            }
        }
        const elStopwatch = document.getElementById('stopwatchText');
        const elTimeText = document.getElementById('timeText');
        if (elStopwatch) {
            if (state.stopwatchText !== undefined && state.stopwatchText !== currentStopWatchTextState) {
                currentStopWatchTextState = state.stopwatchText;
                elStopwatch.textContent = state.stopwatchText;
            }
            if (state.showStopwatch !== undefined && state.showStopwatch !== currentShowStopWatchState) {
                currentShowStopWatchState = state.showStopwatch;
                if (elTimeText && !elTimeText.style.transition) {
                    elTimeText.style.transition = 'font-size 0.5s ease';
                }

                if (state.showStopwatch) {
                    elStopwatch.style.opacity = '1';
                    elStopwatch.style.fontSize = '1.5rem';
                    elStopwatch.style.transform = 'translate(-50%, -20%)';

                    if (elTimeText) {
                        elTimeText.style.fontSize = '3.8rem';
                        elTimeText.style.transform = 'translate(0, -18%)';
                    }
                } else {
                    elStopwatch.style.opacity = '0';
                    elStopwatch.style.fontSize = '0.85rem';
                    elStopwatch.style.transform = 'translate(-50%, -20px)';

                    if (elTimeText) {
                        elTimeText.style.fontSize = '5rem';
                        elTimeText.style.transform = 'translate(0, 0)';
                    }
                }
            }
        }
        if (state.isGoalActive !== undefined) {
            const gc = document.getElementById('goalContainer');
            const gt = document.getElementById('goalText');
            const gb = document.getElementById('goalBarFill');
            if (gc) {
                if (state.goalPercentage !== currentGoalPrecentageState) {
                    currentGoalPrecentageState = state.goalPercentage;
                    if (gb) gb.style.width = `${state.goalPercentage || 0}%`;
                }
                if (state.goalText !== currentGoalTextState) {
                    currentGoalTextState = state.goalText;
                    if (gt) gt.innerText = state.goalText || '';
                }
                if (state.isGoalActive !== currentGoalState) {
                    currentGoalState = state.isGoalActive;
                    if (state.isGoalActive) {
                        gc.style.transform = "translateX(-50%) translateY(-350%)";
                        gc.style.opacity = "1";
                    } else {
                        gc.style.transform = "translateX(-50%) translateY(-200%)";
                        gc.style.opacity = "0";
                    }

                }
            }
        }
        if (state.isPause !== undefined && state.isPause !== currentPauseState) {
            currentPauseState = state.isPause;
            const pauseIcon = document.getElementById('pauseIcon');
            if (window.pauseIconTimeout) {
                clearTimeout(window.pauseIconTimeout);
            }

            if (state.isPause) {
                window.pauseIconTimeout = setTimeout(() => {
                    pauseIcon.style.opacity = "1";
                }, 700);
            } else {
                pauseIcon.style.opacity = "0";
            }
        }
        if (state.sleepModeEnabled !== undefined && state.sleepModeEnabled !== currentSleepState) {
            currentSleepState = state.sleepModeEnabled;

            const sleepMoon = document.getElementById('sleepMoon');
            if (sleepMoon) {
                sleepMoon.style.opacity = state.sleepModeEnabled ? "1" : "0";
            }
        }
    }

    async function bootstrap() {
        try {
            const r = await fetch('./state', {cache: 'no-store'});
            if (r.ok) apply(await r.json());
        } catch {
        }
    }

    function startSSE() {
        const sse = new EventSource('./sse');
        sse.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'tick' && msg.state) {
                    apply(msg.state);
                }
                if (msg.type === 'event' && msg.event?.type === 'addTime') {
                    showAdded(msg.event.seconds);
                }
            } catch {
            }
        };
        sse.onerror = () => {
            try {
                sse.close();
            } catch {
            }
            ;setTimeout(startSSE, 3000);
        };
    }

    bootstrap().then(startSSE);
</script>
</body>
</html>
