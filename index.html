<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>NikiWright Timer</title>
</head>
<body>
<div id="container">
    <div id="textDiv">
        <div id="sleepMoon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </div>
        <div id="pauseIcon"></div>
        <p id="timeText">00:00:00</p>
        <span id="stopwatchText">прошло 0 д 0 ч 0 м 0 с</span>
    </div>
    <span id="rubPerHourText">1000р = 1 час</span>
    <div id="goalContainer">
        <span id="goalText">Сбор: 0 / 0 руб</span>
        <div id="goalBarBg">
            <div id="goalBarFill"></div>
        </div>
    </div>
</div>
<script src="renderer.js"></script>
<script src="https://cdn.jsdelivr.net/gh/centrifugal/centrifuge-js@2.X.X/dist/centrifuge.min.js"></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js' type='text/javascript'></script>
<script src='js/lib/tmi.min.js'></script>
<script src="js/lib/generalFunc.js"></script>
<script src="js/lib/timeFunc.js"></script>

<script src="config.js"></script>
<script src="js/script.js"></script>

<script src="js/control_bridge.js"></script>

<script src="js/api/donationAlerts.js"></script>
<script src="js/api/trula.js"></script>
<script>
    const rubText = document.getElementById('rubPerHourText');

    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    const savedLeft = localStorage.getItem('rubTextLeft');
    const savedTop = localStorage.getItem('rubTextTop');
    const savedFontSize = localStorage.getItem('rubTextFontSize');

    let currentFontSize = savedFontSize ? parseFloat(savedFontSize) : 3.7;

    if (savedFontSize) {
        rubText.style.fontSize = `${currentFontSize}rem`;
    }

    if (savedLeft && savedTop) {
        rubText.style.left = savedLeft;
        rubText.style.top = savedTop;
        rubText.style.bottom = 'auto';
        rubText.style.transform = 'none';
    }

    rubText.addEventListener('mousedown', (e) => {
        isDragging = true;

        const rect = rubText.getBoundingClientRect();
        const parentRect = rubText.parentElement.getBoundingClientRect();

        if (rubText.style.bottom !== 'auto') {
            rubText.style.left = (rect.left - parentRect.left) + 'px';
            rubText.style.top = (rect.top - parentRect.top) + 'px';
            rubText.style.bottom = 'auto';
            rubText.style.transform = 'none';
        }

        startX = e.clientX;
        startY = e.clientY;
        initialLeft = parseFloat(rubText.style.left) || 0;
        initialTop = parseFloat(rubText.style.top) || 0;

        rubText.style.cursor = 'grabbing';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        rubText.style.left = `${initialLeft + dx}px`;
        rubText.style.top = `${initialTop + dy}px`;
    });

    document.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            rubText.style.cursor = 'grab';

            localStorage.setItem('rubTextLeft', rubText.style.left);
            localStorage.setItem('rubTextTop', rubText.style.top);
        }
    });

    rubText.addEventListener('wheel', (e) => {
        e.preventDefault();

        const scaleSpeed = 0.2;

        if (e.deltaY < 0) {
            currentFontSize += scaleSpeed;
        } else {
            currentFontSize -= scaleSpeed;
        }

        if (currentFontSize < 0.5) currentFontSize = 0.5;

        rubText.style.fontSize = `${currentFontSize}rem`;

        localStorage.setItem('rubTextFontSize', currentFontSize);
    });
</script>
</body>
</html>
