<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #111; color: #fff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 60px; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        p { margin: 0; color: rgba(255,255,255,0.7); font-size: 16px; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #4facfe;
            border-radius: 50%; width: 24px; height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto 0;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Обработка токена...</h1>
        <p id="message">Пожалуйста, подождите.</p>
        <div class="spinner" id="spinner"></div>
    </div>

    <script>
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const spinner = document.getElementById('spinner');

        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');

        if (token) {
            fetch(`/auth/save?service=donationAlerts&token=${encodeURIComponent(token)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        title.innerText = 'Авторизация успешна!';
                        title.className = 'success';
                        message.innerText = 'Можете закрыть эту вкладку.';
                    } else {
                        throw new Error('Server error');
                    }
                })
                .catch(err => {
                    title.innerText = 'Ошибка передачи';
                    title.className = 'error';
                    message.innerText = 'Попробуйте еще раз.';
                })
                .finally(() => { spinner.style.display = 'none'; });
        } else {
            title.innerText = 'Токен не найден';
            title.className = 'error';
            message.innerText = 'В URL отсутствует токен доступа. Пожалуйста, попробуйте авторизоваться снова.';
            spinner.style.display = 'none';
        }
    </script>
</body>
</html>
